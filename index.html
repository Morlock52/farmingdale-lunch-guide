<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmingdale Lunch Guide</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Farmingdale Lunch Guide</h1>
        <p>Find the best lunch spots near Farmingdale State College</p>
    </header>

    <main>
        <section id="filters">
            <div class="filter-group">
                <label for="category-filter">Category:</label>
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="pizza">Pizza</option>
                    <option value="deli">Deli</option>
                    <option value="asian">Asian</option>
                    <option value="fast-food">Fast Food</option>
                    <option value="cafe">Cafe</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="price-filter">Price Range:</label>
                <select id="price-filter">
                    <option value="all">All Prices</option>
                    <option value="$">$ (Under $10)</option>
                    <option value="$$">$$ ($10-$20)</option>
                    <option value="$$$">$$$ (Over $20)</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="search-input">Search:</label>
                <input type="text" id="search-input" placeholder="Search restaurants...">
            </div>
        </section>

        <section id="error-display" class="hidden">
            <div class="error-message"></div>
            <button id="retry-btn">Retry</button>
        </section>

        <section id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Loading restaurants...</p>
        </section>

        <section id="restaurants-container">
            <!-- Restaurants will be dynamically loaded here -->
        </section>

        <section id="favorites-section">
            <h2>Your Favorites</h2>
            <div id="favorites-container">
                <p class="empty-favorites">No favorites yet. Click the heart icon to add!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Farmingdale Lunch Guide</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
