<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find the best lunch spots near Farmingdale State College">
    <meta name="theme-color" content="#2c5530">
    <title>Farmingdale Lunch Guide</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- Skip to content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <div class="header-content">
            <h1>Farmingdale Lunch Guide</h1>
            <p>Find the best lunch spots near Farmingdale State College</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <span class="theme-icon-light">&#9728;</span>
            <span class="theme-icon-dark">&#9790;</span>
        </button>
    </header>

    <main id="main-content">
        <section id="filters" aria-label="Filter restaurants">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="category-filter">Category:</label>
                    <div class="multi-select-container" id="category-container">
                        <button type="button" class="multi-select-trigger" id="category-trigger" aria-haspopup="listbox" aria-expanded="false">
                            All Categories
                        </button>
                        <div class="multi-select-dropdown hidden" id="category-dropdown" role="listbox" aria-multiselectable="true">
                            <label class="multi-select-option">
                                <input type="checkbox" value="all" checked> All Categories
                            </label>
                            <label class="multi-select-option">
                                <input type="checkbox" value="pizza"> Pizza
                            </label>
                            <label class="multi-select-option">
                                <input type="checkbox" value="deli"> Deli
                            </label>
                            <label class="multi-select-option">
                                <input type="checkbox" value="asian"> Asian
                            </label>
                            <label class="multi-select-option">
                                <input type="checkbox" value="fast-food"> Fast Food
                            </label>
                            <label class="multi-select-option">
                                <input type="checkbox" value="cafe"> Cafe
                            </label>
                        </div>
                    </div>
                </div>
                <div class="filter-group">
                    <label for="price-filter">Price Range:</label>
                    <select id="price-filter">
                        <option value="all">All Prices</option>
                        <option value="$">$ (Under $10)</option>
                        <option value="$$">$$ ($10-$20)</option>
                        <option value="$$$">$$$ (Over $20)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sort-select">Sort By:</label>
                    <select id="sort-select">
                        <option value="rating">Highest Rated</option>
                        <option value="distance">Nearest</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-group search-group">
                    <label for="search-input">Search:</label>
                    <input type="text" id="search-input" placeholder="Search restaurants..." aria-label="Search restaurants">
                </div>
            </div>
        </section>

        <section id="error-display" class="hidden" role="alert">
            <div class="error-message"></div>
            <button id="retry-btn">Retry</button>
        </section>

        <section id="loading" class="hidden" aria-label="Loading">
            <div class="spinner" role="status" aria-label="Loading restaurants"></div>
            <p>Loading restaurants...</p>
        </section>

        <section id="restaurants-container" aria-label="Restaurant listings" role="list">
            <!-- Restaurants will be dynamically loaded here -->
        </section>

        <section id="favorites-section" aria-label="Your favorite restaurants">
            <h2>Your Favorites</h2>
            <div id="favorites-container">
                <p class="empty-favorites">No favorites yet. Click the heart icon to add!</p>
            </div>
        </section>
    </main>

    <!-- Restaurant Detail Modal -->
    <div id="restaurant-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-overlay"></div>
        <div class="modal-content" role="document">
            <button class="modal-close" aria-label="Close modal">&times;</button>
            <div class="modal-body">
                <img class="modal-image" src="" alt="" loading="lazy">
                <div class="modal-info">
                    <h2 id="modal-title" class="modal-name"></h2>
                    <div class="modal-meta">
                        <span class="modal-category"></span>
                        <span class="modal-price"></span>
                        <span class="modal-rating"></span>
                    </div>
                    <p class="modal-description"></p>
                    <div class="modal-details">
                        <p class="modal-address"><strong>Address:</strong> <span></span></p>
                        <p class="modal-distance"><strong>Distance:</strong> <span></span></p>
                        <p class="modal-phone"><strong>Phone:</strong> <span></span></p>
                        <p class="modal-hours"><strong>Hours:</strong> <span></span></p>
                    </div>
                    <div class="modal-actions">
                        <button class="modal-favorite-btn" aria-label="Add to favorites">
                            <span class="heart-icon">&#9825;</span> Add to Favorites
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Farmingdale Lunch Guide | <a href="#main-content">Back to top</a></p>
    </footer>

    <!-- Toast container will be added by JavaScript -->

    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/data.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
